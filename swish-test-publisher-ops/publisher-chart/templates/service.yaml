apiVersion: v1
kind: Service
metadata:
  labels:
    {{- include "publisher-chart.labels" . | nindent 4 }}
  name: {{ include "publisher-chart.name" . }}-healthcheck
spec:
  ports:
    - port: 50051
      protocol: TCP
      targetPort: 50051
  selector:
    {{ include "publisher-chart.selectorLabels" . | nindent 4 }}
  type: ClusterIP