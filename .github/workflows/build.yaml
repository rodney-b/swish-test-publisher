name: Build

on:
  push:
    branches:
      - "main"
  workflow_dispatch:

# OIDC permissions
permissions:
  id-token: write 
  contents: read

env:
  IAM_ROLE_ARN: "arn:aws:iam::879981263884:role/bumpow-main-github-actions-role"
  AWS_REGION: "us-east-1"
  ECR_REPO_URL: "879981263884.dkr.ecr.us-east-1.amazonaws.com/external/work/swish-analytics/swish-test-default"
  APP_NAME: "publisher"
  IMAGE_TAG: ${{ github.sha }}

jobs:
  Build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.IAM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          file: build/package/publisher/Dockerfile
          platforms: linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.ECR_REPO_URL }}/${{ env.APP_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.ECR_REPO_URL }}/${{ env.APP_NAME }}:latest